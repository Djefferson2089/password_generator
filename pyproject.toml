[project]
name = "passgen"
version = "0.1.0"
description = "A secure, customizable password generator CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel" }]
dependencies = ["typer>=0.12.0"]

[project.scripts]
passgen = "passgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
